[package]
name = "quiron-codex"
version = "0.16.0"
description = "Quirón Codex: estación de estudio para el internado médico y el ENARM"
authors = ["Alexander Carrillo de la Cruz"]
edition = "2021"

[lib]
name = "quiron_codex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# Binario pequeño y rápido (importante en la Surface).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
