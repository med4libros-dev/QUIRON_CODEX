# Compila el instalador de Windows (.msi y .exe) en los servidores de GitHub.
# Se ejecuta a mano (pestaña Actions → «Instalador de Windows» → Run workflow)
# o al publicar una etiqueta de versión (git tag v0.3.0 && git push --tags).
name: Instalador de Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Dependencias
        run: npm install

      - name: Compilar Quirón Codex
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Con etiqueta v* crea un borrador de Release con los instaladores adjuntos.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Quirón Codex ${{ github.ref_name }}'
          releaseDraft: true

      - name: Guardar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: quiron-codex-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
