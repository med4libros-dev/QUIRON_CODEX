# Publica la versión web en GitHub Pages: https://med4libros-dev.github.io/QUIRON_CODEX/
# Es la misma app, sin instalar nada. Se puede «Agregar a inicio» en iPad o Android.
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencias
        run: npm install

      - name: Compilar la versión web
        run: npm run build

      # Sin esto, GitHub sirve el sitio con Jekyll y se come las carpetas que empiezan con «_».
      - name: Desactivar Jekyll
        run: touch dist/.nojekyll

      # enablement: enciende Pages la primera vez, sin tocar los ajustes del repositorio a mano.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
